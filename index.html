<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Life School Family</title>
<meta name="description" content="Life School Family: istruzione parentale, materiali didattici inclusivi e il test gratuito per scegliere la scuola superiore.">
<link rel="icon" href="tre-strade/img/logo.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;700;800&display=swap">
<style>
*{box-sizing:border-box}body{margin:0;background:#EEF0F7;font-family:'Outfit',system-ui,sans-serif;color:#111}
main{max-width:480px;margin:0 auto;min-height:100vh;background:#fff;padding:28px 22px;display:flex;flex-direction:column;gap:18px}
h1{margin:0;font-size:34px;line-height:1.05;font-weight:800}p{margin:0;font-size:17px;line-height:1.4}
.bars{display:flex;gap:8px}.bars i{width:64px;height:10px;border:2px solid #111;border-radius:999px}
a.btn{display:flex;align-items:center;justify-content:center;min-height:58px;background:#008744;color:#fff;border:3px solid #111;border-radius:16px;box-shadow:4px 4px 0 #111;font-size:19px;font-weight:800;text-decoration:none;text-align:center;padding:8px 16px}
a.btn:focus-visible{outline:3px solid #4361EE;outline-offset:3px}
.card{background:#F3F5FF;border:3px solid #111;border-radius:18px;padding:16px;display:flex;flex-direction:column;gap:10px}
.small{font-size:13px;color:#333}
@media (min-width:520px){main{margin:18px auto;min-height:0;border:3px solid #111;border-radius:26px;box-shadow:8px 8px 0 #111}}
</style>
</head>
<body>
<main>
<img src="tre-strade/img/scritta.png" alt="Life School Family" style="width:100%;max-width:360px;height:auto">
<div class="bars" aria-hidden="true"><i style="background:#FF3131"></i><i style="background:#00BF63"></i><i style="background:#5170FF"></i></div>
<h1>Dopo le medie?<br>Tre strade per te!</h1>
<p>Il test gratuito per scoprire quali scuole ti somigliano.</p>
<a class="btn" href="tre-strade/">Fai il test</a>
<div class="card"><p><b>Il sito è in costruzione.</b></p><p>Presto qui troverai i materiali, il blog e le novità di Life School Family.</p></div>
<p class="small">Life School Family: istruzione parentale e materiali didattici inclusivi.</p>
</main>
</body>
</html>
